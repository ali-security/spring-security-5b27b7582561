name: PR Build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional Gradle test filter'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Set up gradle
        uses: spring-io/spring-gradle-build-action@v2
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Gradle
        run: ./gradlew clean build -PskipCheckExpectedBranchVersion --continue ${{ inputs.test-filter }}
      - name: Upload spring-security-web jar
        uses: actions/upload-artifact@v4
        with:
          name: spring-security-web-jar
          path: web/build/libs/spring-security-web-*.jar
          if-no-files-found: error
          overwrite: true
      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'PYEOF'
          import glob, sys, xml.etree.ElementTree as ET
          files = sorted(glob.glob('**/build/test-results/**/TEST-*.xml', recursive=True))
          per, tot, fail, err, skip = {}, 0, 0, 0, 0
          for f in files:
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              if root.tag != 'testsuite':
                  continue
              t = int(root.get('tests', 0)); fa = int(root.get('failures', 0))
              e = int(root.get('errors', 0)); s = int(root.get('skipped', 0))
              tot += t; fail += fa; err += e; skip += s
              mod = f.split('/build/')[0]
              a = per.setdefault(mod, [0, 0, 0, 0])
              a[0] += t; a[1] += fa; a[2] += e; a[3] += s
          print('JUnit test results per module:')
          for mod in sorted(per):
              t, fa, e, s = per[mod]
              print('  %s: tests=%d failures=%d errors=%d skipped=%d' % (mod, t, fa, e, s))
          print('TOTAL: suites=%d tests=%d failures=%d errors=%d skipped=%d'
                % (len(files), tot, fail, err, skip))
          if tot == 0:
              print('ERROR: no JUnit test results were produced')
              sys.exit(1)
          if fail or err:
              print('ERROR: test failures present')
              sys.exit(1)
          print('All %d tests passed.' % tot)
          PYEOF
